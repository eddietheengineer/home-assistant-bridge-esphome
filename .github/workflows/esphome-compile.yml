name: ESPHome Compilation Test

on:
  push:
    branches:
      - main
      - develop

jobs:
  compile-test:
    name: Compile ESPHome Configuration
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome-${{ hashFiles('docs/test-compile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-esphome-
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('docs/test-compile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install esphome

      - name: Copy test secrets
        run: |
          cp docs/test-secrets.yaml docs/secrets.yaml

      - name: Compile example configuration
        run: |
          esphome compile docs/test-compile.yaml

      - name: Clean up secrets
        if: always()
        run: |
          rm -f docs/secrets.yaml

  test:
    name: Run CppUTest Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install CppUTest
        uses: lyricwulf/abc@v1
        with:
          all: cpputest

      - uses: SimenB/github-actions-cpu-cores@v1
        id: cpu-cores

      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - run: make test -j${{ steps.cpu-cores.outputs.count }}

  pytest:
    name: Run Python Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jinja2

      - name: Run Python tests
        run: |
          python -m pytest scripts/test_*.py -v
